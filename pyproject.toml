[project]
name = "enterprise-ai-knowledge-assistant"
version = "0.1.0"
description = "Production-oriented enterprise RAG knowledge assistant"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "pymupdf",
    "python-docx",
    "alembic",
    "email-validator",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

ml = [
    "sentence-transformers",
    "numpy",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-per-file-ignores = {"app/api/routes/*.py" = ["B008"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]